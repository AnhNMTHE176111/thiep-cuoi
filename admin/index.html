<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Thiệp cưới Ngọc Đức &amp; Hồng Thắm</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --nau:#8E7C69; --nau-nhat:#a08f7d; --nen:#f6f3f0; --vien:#e0d6c9; --trang:#fff;
    --xanh:#3d7a5c; --do:#b5493f; --vang:#b7862c;
  }
  *{box-sizing:border-box}
  /* BUG-04: khoa chieu cao trang, chi cot giua duoc cuon.
     grid-template-rows:minmax(0,1fr) la phan bat buoc: khong co no, hang grid mac dinh
     "auto" se phinh cao theo noi dung dai nhat ben trong (grid blowout) va keo ca trang
     cuon theo, du .layout da duoc flex ep cao bang man hinh. */
  html,body{height:100%;overflow:hidden}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Arial,sans-serif;background:var(--nen);color:#3a332c;display:flex;flex-direction:column}
  h1,h2,h3{margin:0 0 8px;font-weight:600}
  .layout{display:grid;grid-template-columns:220px 1fr 380px;grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
  .layout > main{min-width:0;display:flex;flex-direction:column;min-height:0}
  .cot-nav{background:var(--trang);border-right:1px solid var(--vien);padding:16px 0;overflow-y:auto;min-height:0}
  .cot-nav .nhom{margin:16px 0 4px;padding:0 16px;font-size:11px;letter-spacing:.5px;color:var(--nau-nhat);text-transform:uppercase}
  .cot-nav button{display:block;width:100%;text-align:left;padding:9px 16px;border:0;background:none;cursor:pointer;font-size:13.5px;font-family:inherit;color:#3a332c;border-left:3px solid transparent}
  .cot-nav button:hover{background:var(--nen)}
  .cot-nav button.active{background:var(--nen);border-left-color:var(--nau);font-weight:600;color:var(--nau)}
  .cot-giua{padding:24px 32px 40px;overflow-y:auto;flex:1;min-height:0}
  .cum{max-width:640px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--nau);margin-bottom:4px}
  .field .goi-y{font-size:12px;color:var(--nau-nhat);margin-top:4px}
  .field input[type=text],.field input[type=time],.field input[type=date],.field input[type=file],.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--vien);border-radius:8px;font:inherit;background:var(--trang);color:inherit
  }
  .field textarea{min-height:64px;resize:vertical}
  /* BUG-03: o chon mau phai la mot o vuong to ro, khong dung chung padding voi input text */
  .o-mau{display:flex;gap:10px;align-items:center}
  .o-mau input[type=color]{width:44px;height:44px;flex:0 0 44px;padding:2px;border:1px solid #b9ab97;
    border-radius:10px;background:var(--trang);cursor:pointer;-webkit-appearance:none;appearance:none}
  .o-mau input[type=color]::-webkit-color-swatch{border:0;border-radius:7px}
  .o-mau input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .o-mau input[type=color]::-moz-color-swatch{border:0;border-radius:7px}
  .o-mau input[type=text]{flex:1;font-family:ui-monospace,Consolas,monospace;text-transform:uppercase}
  .field .canh-bao{color:var(--vang);font-size:12px;margin-top:4px;display:flex;gap:5px;align-items:start}
  .field .loi{color:var(--do);font-size:12px;margin-top:4px}
  .hang2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hang3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .khung{border:1px solid var(--vien);border-radius:12px;padding:16px;background:var(--trang);margin-bottom:16px}
  .khung h3{font-size:13px;color:var(--nau);display:flex;justify-content:space-between;align-items:center}
  .nut{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:1px solid var(--nau);background:var(--trang);color:var(--nau);font:inherit;font-weight:600;cursor:pointer;font-size:13px}
  .nut:hover{background:var(--nen)}
  .nut.chinh{background:var(--nau);color:#fff}
  .nut.chinh:hover{opacity:.9}
  .nut.nho{padding:5px 11px;font-size:12px;border-radius:14px}
  .nut.nguy{border-color:var(--do);color:var(--do)}
  .nut:disabled{opacity:.5;cursor:not-allowed}
  .quay{display:inline-block;flex:none;width:12px;height:12px;margin-right:6px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:quay .7s linear infinite;vertical-align:-2px}
  @keyframes quay{to{transform:rotate(360deg)}}
  .cong-tac{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .cong-tac input{display:none}
  .cong-tac .bi{width:36px;height:20px;border-radius:12px;background:#d7cdbe;position:relative;transition:.15s}
  .cong-tac .bi::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
  .cong-tac input:checked + .bi{background:var(--xanh)}
  .cong-tac input:checked + .bi::after{left:18px}
  table.ds{width:100%;border-collapse:collapse;font-size:13px}
  table.ds th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--nau-nhat);padding:6px 8px;border-bottom:1px solid var(--vien)}
  table.ds td{padding:7px 8px;border-bottom:1px solid #f0ebe3;vertical-align:middle}
  table.ds tr:hover td{background:#fbf9f6}
  .the{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .the.trai{background:#e7eef7;color:#3a5f8a}
  .the.gai{background:#fbe9ec;color:#a04a5a}
  .thanh-tren{position:sticky;top:0;background:rgba(246,243,240,.92);backdrop-filter:blur(6px);padding:14px 32px;border-bottom:1px solid var(--vien);display:flex;justify-content:space-between;align-items:center;z-index:5}
  .thanh-tren h2{font-size:16px}
  /* BUG-01: thiep la layout tuyet doi khô cung 420px -> KHONG the co gian.
     Cho iframe dung 420px roi transform:scale() thu nho vua khung dien thoai. */
  .cot-xem{background:var(--trang);border-left:1px solid var(--vien);padding:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .khung-dt{width:100%;align-self:stretch;margin:0 auto;border:8px solid #2a2a2a;border-radius:28px;overflow:hidden;
    background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15);flex:1 1 auto;min-height:0;position:relative}
  .khung-dt .boc-scale{position:absolute;inset:0;overflow:hidden}
  .khung-dt iframe{width:420px;border:0;display:block;transform-origin:top left;background:#fff}
  .chon-ban{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
  .chon-ban button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--vien);background:var(--trang);cursor:pointer;font:inherit;font-size:12.5px}
  .chon-ban button.active{background:var(--nau);color:#fff;border-color:var(--nau)}
  .thanh-trang-thai{flex:0 0 auto;background:#2a2420;color:#fff;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:12px;flex-wrap:wrap}
  .thanh-trang-thai.sach{background:#3a332c}
  .cham{width:7px;height:7px;border-radius:50%;background:var(--vang);display:inline-block;margin-right:6px}
  .cham.sach{background:var(--xanh)}
  .chip-mau{font-size:11px;padding:2px 7px;border-radius:8px;background:#fdf2d8;color:#8a6d1f;margin-left:6px}
  a.link-nho{color:var(--nau);font-size:12px}
  textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:220px;background:#faf8f5}
  .hop-thong-bao{position:fixed;top:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
  .thong-bao{background:#2a2420;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:340px}
  .thong-bao.loi{background:#7a2e28}
  .thong-bao.ok{background:#2e5c40}
  .an{display:none !important}
  .nhap-token{display:flex;gap:8px}
  .nhap-token input{flex:1}
  .muc-nho{font-size:12px;color:var(--nau-nhat)}
  .khach-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .drop-import{border:2px dashed var(--vien);border-radius:10px;padding:16px;text-align:center;color:var(--nau-nhat);font-size:12.5px;margin-bottom:12px}
  .drop-import textarea{width:100%;min-height:90px;margin-top:8px}
  .hang-nut{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .canh-bao-do{color:var(--do);font-size:12.5px;margin-top:6px}
  .o-tai-len{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .o-tai-len input[type=file]{font-size:12px;max-width:220px}
  .trang-thai-tai{font-size:12px;color:var(--nau-nhat)}
  /* the khach (danh sach khach mua tren Google Sheet) */
  .o-tim{width:100%;padding:9px 11px;border:1px solid var(--vien);border-radius:8px;font:inherit;margin-bottom:12px}
  .bo-loc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .bo-loc button{padding:5px 12px;border-radius:14px;border:1px solid var(--vien);background:var(--trang);font:inherit;font-size:12px;cursor:pointer;color:#3a332c}
  .bo-loc button.active{background:var(--nau);color:#fff;border-color:var(--nau)}
  .khach-the{border:1px solid var(--vien);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--trang)}
  .khach-the .hang-tren{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .khach-the input.ten-khach{border:0;background:none;font:inherit;font-size:15px;font-weight:600;flex:1;min-width:0;padding:2px 0}
  .khach-the .hang-duoi{display:flex;justify-content:flex-end;align-items:center;margin-top:8px;gap:6px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;margin-right:auto}
  .pill.cho{background:#f0ebe3;color:var(--nau-nhat)}
  .pill.gui{background:#e7eef7;color:#3a5f8a}
  .pill.den{background:#e5f1ea;color:var(--xanh)}
  .pill.khong{background:#fbe9e7;color:var(--do)}
  .trang-thai-ket-noi{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}
  /* o nhap o muc Khach moi: cung kieu voi .field, co gian theo be ngang */
  .khach-toolbar input,.khach-toolbar select,.drop-import select{padding:8px 10px;border:1px solid var(--vien);border-radius:8px;font:inherit;background:var(--trang);color:inherit}
  .khach-toolbar input{min-width:0}
  .khach-toolbar input[type=text]{flex:1 1 160px}
  .tick-duc{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none;color:var(--nau, #6b5a48)}
  .tick-duc input[type=checkbox]{flex:none;width:18px;height:18px;margin:0;padding:0;accent-color:#8E7C69}
  .drop-import .hang-nhap{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
  .nut-menu{display:none;border:1px solid var(--vien);background:var(--trang);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--nau);flex:0 0 auto}
  .man-che{display:none}
  /* BUG-10: media query phai nam CUOI file, neu khong rule sau se de len .cot-xem{display:flex} */
  @media (max-width:1100px){
    .layout{grid-template-columns:200px 1fr}
    .cot-xem{display:none !important}
  }
  /* dien thoai: menu trai thanh ngan keo, bam nut ☰ moi hien */
  @media (max-width:700px){
    .layout{grid-template-columns:1fr}
    .cot-nav{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:82vw;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
    body.mo-menu .cot-nav{transform:none}
    body.mo-menu .man-che{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
    .nut-menu{display:inline-flex;align-items:center;justify-content:center}
    .thanh-tren{padding:10px 12px;gap:10px}
    .thanh-tren h2{flex:1;min-width:0;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cot-giua{padding:16px 12px 32px}
    .hang2,.hang3{grid-template-columns:1fr}
    .khach-toolbar input[type=text]{flex-basis:100%}
    .khach-toolbar .tick-duc{flex-basis:100%;order:3}
    .khach-toolbar .nut.chinh{order:2}
    .khach-toolbar select{flex:1}
    .khach-toolbar .nut.chinh{flex:1;justify-content:center}
    /* 16px: iPhone tu phong to trang khi bam vao o chu nho hon 16px */
    input,select,textarea{font-size:16px !important}
    .thanh-trang-thai{padding:8px 12px}
    .thanh-trang-thai #lanLuuCuoi{display:none}
    .hop-thong-bao{left:12px;right:12px;top:12px}
    .thong-bao{max-width:none}
  }
</style>
</head>
<body>

<div class="hop-thong-bao" id="hopThongBao"></div>

<div class="man-che" id="manChe"></div>
<div class="layout">
  <nav class="cot-nav" id="cotNav"></nav>
  <main>
    <div class="thanh-tren">
      <button class="nut-menu" id="nutMenu" type="button" aria-label="Mở menu">☰</button>
      <h2 id="tieuDeCum">Tổng quan</h2>
      <div style="display:flex;gap:8px">
        <button class="nut" id="nutXemLink" type="button">Mở link thiệp</button>
      </div>
    </div>
    <div class="cot-giua" id="cotGiua"></div>
  </main>
  <aside class="cot-xem">
    <div class="chon-ban">
      <button id="chonTrai" class="active" type="button">Nhà trai</button>
      <button id="chonGai" type="button">Nhà gái</button>
    </div>
    <div class="khung-dt" id="khungDT"><div class="boc-scale"><iframe id="khungXem" title="Xem trước thiệp" allow=""></iframe></div></div>
    <p class="muc-nho" style="text-align:center;margin:8px 0 0">Xem trước theo dữ liệu đang sửa (đã tắt nhạc) — chưa cần lưu</p>
  </aside>
</div>

<div class="thanh-trang-thai sach" id="thanhTrangThai">
  <span><span class="cham sach" id="chamTrangThai"></span><span id="chuTrangThai">Chưa có thay đổi</span></span>
  <span style="display:flex;gap:10px;align-items:center">
    <span class="muc-nho" id="lanLuuCuoi"></span>
    <button class="nut chinh" id="nutDang" type="button">Đăng lên link thật</button>
  </span>
</div>

<script src="../sinh.js?v=94caafe266"></script>
<script src="admin.js?v=94caafe266"></script>
</body>
</html>
